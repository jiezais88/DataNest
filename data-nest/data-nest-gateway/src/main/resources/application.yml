server:
  port: 8080

spring:
  application:
    name: data-nest-gateway

  config:
    import:
      - optional:nacos:shared-redis.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-security.yaml?group=shared-configs&refreshEnabled=true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
      config:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        file-extension: yaml

    gateway:
      server:
        webflux:
          routes:
            - id: system-service
              uri: lb://data-nest-system
              predicates:
                - Path=/api/system/**
              filters:
                - StripPrefix=1
            - id: engineering-service
              uri: lb://data-nest-engineering
              predicates:
                - Path=/api/engineering/**
              filters:
                - StripPrefix=1
            - id: governance-service
              uri: lb://data-nest-governance
              predicates:
                - Path=/api/governance/**
              filters:
                - StripPrefix=1

