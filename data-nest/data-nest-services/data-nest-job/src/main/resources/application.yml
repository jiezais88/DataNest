server:
  port: 8086
  servlet:
    context-path: /job

spring:
  application:
    name: data-nest-job

  # 微服务化阶段 5：job 为纯调度节点，无任何业务库（全部经 Feign 调 owner 服务），
  # 排除数据源相关自动配置避免 "Failed to configure a DataSource" 启动失败。
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

  config:
    import:
      - optional:nacos:shared-nacos.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-common.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-xxljob.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-security.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-dolphinscheduler.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-rpc.yaml?group=shared-configs&refreshEnabled=true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml

xxl:
  job:
    executor:
      appname: data-nest-job
      port: 9996
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

datanest:
  job:
    xxl-job:
      job-group-id: ${XXL_JOB_GROUP_ID:0}
    dag-sync:
      # DAG 执行状态兜底同步周期：默认 30s。
      # 当仍有 RUNNING 的 execution 时，handler 会自适应触发下一次同步（最小间隔 1s）。
      cron: ${DAG_SYNC_CRON:0/30 * * * * ?}
      adaptive-enabled: true
      adaptive-min-interval-ms: 1000
      # 刚 trigger 的 execution 在多少毫秒内不参与同步，给 DS 启动时间。
      silent-period-ms: 2000
    dag-history-cleanup:
      # DAG 执行历史保留天数（终态记录保留多久后清理）。
      retain-days: ${DAG_HISTORY_RETAIN_DAYS:30}
    lineage-cleanup:
      # 血缘记录保留天数（lineage_record 按 created_at 清理）。
      retain-days: ${LINEAGE_RETAIN_DAYS:90}
    alert-history-cleanup:
      # 告警发送历史保留天数（alert_history 按 sent_at 清理）。
      retain-days: ${ALERT_HISTORY_RETAIN_DAYS:90}
