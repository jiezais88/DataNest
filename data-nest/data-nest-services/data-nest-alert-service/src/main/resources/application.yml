server:
  port: 8088
  servlet:
    context-path: /alert


spring:
  application:
    name: data-nest-alert

  config:
    import:
      - optional:nacos:shared-nacos.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-common.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-datasource.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-security.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-rpc.yaml?group=shared-configs&refreshEnabled=true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml


  # DAG 告警邮件配置（原 shared-alert.yaml 下沉，仅本服务消费）
  # 默认关闭告警；生产环境通过环境变量注入真实 SMTP 后开启。
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

datanest:
  # 接口文档（springdoc，common DocsAutoConfiguration 读取；网关聚合页在线调试用前缀）
  docs:
    title: DataNest 告警服务 API（告警规则/历史/DAG 告警）
    gateway-prefix: /api/alert
  alert:
    enabled: ${ALERT_ENABLED:false}
