server:
  port: 8080

spring:
  application:
    name: data-nest-gateway

  config:
    import:
      - optional:nacos:shared-nacos.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-common.yaml?group=shared-configs&refreshEnabled=true
      - optional:nacos:shared-security.yaml?group=shared-configs&refreshEnabled=true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s
            pool:
              type: elastic
              max-connections: 500
              max-life-time: 30s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            - id: system-service
              uri: lb://data-nest-system
              predicates:
                - Path=/api/system/**
              filters:
                - StripPrefix=1
            - id: engineering-service
              uri: lb://data-nest-engineering
              predicates:
                - Path=/api/engineering/**
              filters:
                - StripPrefix=1
            - id: governance-service
              uri: lb://data-nest-governance
              predicates:
                - Path=/api/governance/**
              filters:
                - StripPrefix=1
            - id: worker-service
              uri: lb://data-nest-worker
              predicates:
                - Path=/api/worker/**
              filters:
                - StripPrefix=1
            - id: alert-service
              uri: lb://data-nest-alert
              predicates:
                - Path=/api/alert/**
              filters:
                - StripPrefix=1
            - id: realtime-service
              uri: lb://data-nest-realtime
              predicates:
                - Path=/api/realtime/**
              filters:
                - StripPrefix=1
            - id: data-service
              uri: lb://data-nest-data-service
              predicates:
                - Path=/api/data-service/**
              filters:
                - StripPrefix=1
              metadata:
                response-timeout: 75000   # 75s：后端 SQL 超时 60s + 15s 缓冲，避免 SELECT SLEEP(60) 被网关先截成 504
                connect-timeout: 3000

# ============================================
# 接口文档聚合页（springdoc swagger-ui）
# 入口 http://localhost:8080/swagger-ui.html，右上角下拉切换服务；
# 各服务 OpenAPI JSON 经既有路由转发（/api/<svc>/v3/api-docs → 服务 context-path 下 /v3/api-docs）。
# 在线调试 URL 由服务端 OpenAPI servers（datanest.docs.gateway-prefix）保证带网关前缀。
# ============================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 文档按服务分页签排序展示
    tags-sorter: alpha
    operations-sorter: alpha
    urls:
      - name: 系统服务（认证/用户/权限）
        url: /api/system/v3/api-docs
      - name: 数据工程（同步任务/DAG/数据源/任务模板）
        url: /api/engineering/v3/api-docs
      - name: 数据治理（元数据/质量/血缘/资产目录/采集）
        url: /api/governance/v3/api-docs
      - name: 告警服务（告警规则/历史/DAG 告警）
        url: /api/alert/v3/api-docs
      - name: 实时 CDC 管道
        url: /api/realtime/v3/api-docs
      - name: 数据服务（SQL 终端/数据 API）
        url: /api/data-service/v3/api-docs
