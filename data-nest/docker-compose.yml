  #   command: [ "/bin/bash", "/sqlserver-entrypoint.sh" ]
  #   healthcheck:
  #     test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' | grep -q '1'" ]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 20
  #     start_period: 60s
  #   networks:
  #     - datanest-net

  # ============================================
  # 应用层 (app-*) — 业务服务
  # ============================================

  # ============================================
  # Gateway — Spring Cloud Gateway（统一入口）
  # 端口: 8080
  # ============================================
  app-gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: datanest-app-gateway
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8080" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # System — 用户与权限服务
  # ============================================
  app-system:
    build:
      context: .
      dockerfile: docker/system.Dockerfile
    container_name: datanest-app-system
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_system
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    # 不暴露宿主机端口，仅通过 app-gateway 访问
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8087" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Alert — 告警中心服务（告警规则/历史 + 邮件发送收拢于此）
  # ============================================
  app-alert:
    build:
      context: .
      dockerfile: docker/alert.Dockerfile
    container_name: datanest-app-alert
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_alert
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
      # MailHog 本地邮件测试
      - MAIL_HOST=datanest-mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=mailhog
      - MAIL_PASSWORD=mailhog
      - MAIL_FROM=test@datanest.local
      - ALERT_ENABLED=true
    # 不暴露宿主机端口：对外统一走 gateway /api/alert/**，容器间 Feign 走 datanest-net:8088
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8088" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Engineering — 数据工程服务（同步任务 + Sprint 3 DAG API）
  # ============================================
  app-engineering:
    build:
      context: .
      dockerfile: docker/engineering.Dockerfile
    container_name: datanest-app-engineering
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_engineering
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    # ADR-S3-012：回调走 gateway（app-gateway:8080/api/worker/dev/internal/**），
    # 不再直连 engineering 8082。Docker 内网 gateway 与 app-worker 在同 datanest-net。
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      middleware-test-mysql:
        condition: service_healthy
      middleware-test-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8082" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Governance — 元数据采集与治理服务
  # ============================================
  app-governance:
    build:
      context: .
      dockerfile: docker/governance.Dockerfile
    container_name: datanest-app-governance
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_governance
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8084" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Runner — 同步任务与元数据采集执行器（避免和 DS worker 重名改 runner）
  # ============================================
  app-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: datanest-app-worker
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      middleware-test-mysql:
        condition: service_healthy
      middleware-test-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8085" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net
    volumes:
      - ./data/python-sandbox:/tmp/datanest-python-sandbox

  # ============================================
  # Job — 平台定时任务执行器
  # ============================================
  app-job:
    build:
      context: .
      dockerfile: docker/job.Dockerfile
    container_name: datanest-app-job
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8086" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # MailHog — 本地邮件测试（SMTP 1025 / Web UI 8025）
  # ============================================
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: datanest-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - datanest-net

  # ============================================
  # Frontend — Nginx 静态资源 + API 反向代理
  # 端口: 3000
  # ============================================
  app-frontend:
    build:
      context: ./data-nest-frontend
      dockerfile: Dockerfile
    container_name: datanest-app-frontend
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "3000:80"
    depends_on:
      app-gateway:
        condition: service_healthy
      app-engineering:
        condition: service_healthy
      app-governance:
        condition: service_healthy
      app-worker:
        condition: service_healthy
      app-job:
        condition: service_healthy
    networks:
      - datanest-net

# ============================================
# Volumes — 持久化数据卷
# 中间件数据卷保留旧名以兼容历史数据
# ============================================
volumes:
  # 兼容历史（保留旧名避免数据丢失）
  nacos-mysql-data:
  nacos-data:
  nacos-logs:
  pgdata:
  redisdata:
  test-mysql-data:
  test-postgres-data:
  # test-oracle-data:  # Sprint 5 临时注释：Oracle 服务已停用
  # PowerJob server 持久化（日志/H2 本地库等）
  powerjob-server-data:

# ============================================
# Networks — 统一网络
# ============================================
networks:
  datanest-net:
    name: datanest-net
