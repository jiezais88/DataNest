services:
  # ============================================
  # 中间件层 (middleware-*) — 基础设施服务
  # ============================================
  # 命名规范: <项目>-<模块>-<服务>
  #   - middleware-* = 基础设施（DB/Cache/Registry/调度）
  #   - app-*        = 业务应用（gateway/system/data/frontend/ds）
  # volume 命名保留旧名(nacos-mysql-data/pgdata/...)以兼容历史数据

  # ============================================
  # MySQL 8.0 — 统一数据库（Nacos + PowerJob + 测试库都复用）
  # ============================================
  middleware-mysql:
    image: mysql:8.0
    container_name: datanest-middleware-mysql
    restart: unless-stopped
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: nacos
      MYSQL_USER: nacos
      MYSQL_PASSWORD: nacos123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - nacos-mysql-data:/var/lib/mysql
      - ./scripts/nacos-mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-mysql-schema.sql:ro
      - ./scripts/init-powerjob-db.sql:/docker-entrypoint-initdb.d/02-init-powerjob-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin -u root -proot123 ping | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Nacos 3.1.1 — 注册 + 配置中心
  # 端口: 8848(主服务) / 9848(gRPC) / 8081(控制台映射 8080)
  # ============================================
  middleware-nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: datanest-middleware-nacos
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=middleware-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos123
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=ZGF0YW5lc3QtbmFjb3Mtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNg==
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8081:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
      - ./tmp/logs/nacos:/home/nacos/logs
    depends_on:
      middleware-mysql:
        condition: service_healthy
    healthcheck:
      # Nacos 3.x 无 readiness 端点（旧 console health 已 410），metrics 报 UP 时 gRPC/鉴权可能未就绪；
      # 用登录探针做功能性就绪检查（能签发 token = HTTP + 存储 + 鉴权子系统就绪）；
      # start_period 拉长到 180s + 30 次重试（总窗口约 8 分钟），覆盖慢机器冷启动
      test: [ "CMD-SHELL", "curl -s -X POST http://localhost:8848/nacos/v1/auth/users/login -d 'username=nacos&password=nacos' | grep -q accessToken || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks:
      - datanest-net

  # ============================================
  # PowerJob 5.1.2 — 统一调度中心（已替换 XXL-JOB + DolphinScheduler）
  # 复用 middleware-mysql 的 powerjob 库（14 张表，官方 powerjob-mysql.sql 初始化）
  # 注意：PowerJob 数据源配置前缀是 spring.datasource.core.*（非标准 spring.datasource.*）
  # 端口: 7700 (控制台+OpenAPI) / 10010 (HTTP transporter) / 10086 (AKKA transporter)
  # ============================================
  middleware-powerjob:
    image: powerjob/powerjob-server:5.1.2
    container_name: datanest-middleware-powerjob
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JVMOPTIONS=-Xmx512m
      - PARAMS=--oms.mongodb.enable=false --spring.datasource.core.jdbc-url=jdbc:mysql://middleware-mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.core.username=nacos --spring.datasource.core.password=nacos123 --oms.storage.dfs.mysql_series.url=jdbc:mysql://middleware-mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --oms.storage.dfs.mysql_series.username=nacos --oms.storage.dfs.mysql_series.password=nacos123 --oms.storage.dfs.mysql_series.auto_create_table=true
    ports:
      - "7700:7700"
      - "10010:10010"
      - "10086:10086"
    volumes:
      - powerjob-server-data:/root/powerjob/server/
    depends_on:
      middleware-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7700/ > /dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks:
      - datanest-net

  # ============================================
  # PostgreSQL 16 — DataNest 业务数据主库（用户/权限/同步任务/DAG 等）
  # ============================================
  middleware-postgres:
    image: postgres:16-alpine
    container_name: datanest-middleware-postgres
    restart: unless-stopped
    command: postgres -c timezone=Asia/Shanghai
    environment:
      POSTGRES_USER: datanest
      POSTGRES_PASSWORD: datanest123
      # 显式设为系统维护库 postgres：避免 initdb 再建已废弃的旧共享库 datanest（Sprint 10 已拆 6 域库，
      # 且 POSTGRES_DB 缺省会取 POSTGRES_USER 同名建库）；6 域库由 init-postgres-db.sql 创建
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres-db.sql:/docker-entrypoint-initdb.d/01-init-postgres-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U datanest" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Redis 7 — Sa-Token 会话存储 + Sprint 3 DAG 互斥锁（SETNX）
  # ============================================
  middleware-redis:
    image: redis:7-alpine
    container_name: datanest-middleware-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # MinIO — 对象存储（Sprint 8 实时 CDC：Iceberg 湖仓数据 + 元数据）
  # 端口: 9000 (S3 API) / 9001 (Console)
  # 账号: datanest / datanest123（对齐 shared-minio.yaml 设计）
  # ============================================
  middleware-minio:
    # 版本锁定：RELEASE.2025-09-07T16-13-09Z（2026-08-09 实测的 minio/minio:latest 实际版本，固化避免漂移）
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: datanest-middleware-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: datanest
      MINIO_ROOT_PASSWORD: datanest123
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # minio/minio 官方镜像不含 curl/mc，用 bash /dev/tcp 探测 S3 端口
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000' 2>/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Flink 2.2.1 Session 集群 — Sprint 8 实时 CDC 作业执行引擎
  # JobManager (REST 8081) + TaskManager (1 slot)
  # 自定义镜像（docker/flink/Dockerfile）预置 CDC 3.6.0-2.2 全部运行时 jar + MinIO S3 配置
  # ============================================
  middleware-flink-jobmanager:
    build: ./docker/flink
    image: datanest-flink:2.2.1
    container_name: datanest-middleware-flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    environment:
      - TZ=Asia/Shanghai
      - JOB_MANAGER_RPC_ADDRESS=middleware-flink-jobmanager
      - |-
        FLINK_PROPERTIES=jobmanager.memory.process.size:1600m
        pekko.ask.timeout: 120s
        execution.checkpointing.interval: 30s
        classloader.check-leaked-classloader: false
        # 重启策略：fixed-delay 最多 3 次，保证异常作业能进入 FAILED 终态（FAILURE 告警可观测）
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 5s
      # MinIO S3 凭据（flink-s3-fs-hadoop 的 S3A 从环境变量读凭据）
      - AWS_ACCESS_KEY_ID=datanest
      - AWS_SECRET_ACCESS_KEY=datanest123
    ports:
      # 宿主 18081 -> 容器 8081（宿主 8081 已被 nacos 占用）；容器内网访问仍走 middleware-flink-jobmanager:8081
      - "18081:8081"   # REST + Web UI
    volumes:
      - flink-data:/opt/flink/data
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - datanest-net

  middleware-flink-taskmanager:
    build: ./docker/flink
    image: datanest-flink:2.2.1
    container_name: datanest-middleware-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      - TZ=Asia/Shanghai
      - JOB_MANAGER_RPC_ADDRESS=middleware-flink-jobmanager
      - |-
        FLINK_PROPERTIES=taskmanager.memory.process.size:1728m
        taskmanager.numberOfTaskSlots:2
        pekko.ask.timeout: 120s
        classloader.check-leaked-classloader: false
      # MinIO S3 凭据（flink-s3-fs-hadoop 的 S3A 从环境变量读凭据）
      - AWS_ACCESS_KEY_ID=datanest
      - AWS_SECRET_ACCESS_KEY=datanest123
    depends_on:
      middleware-flink-jobmanager:
        condition: service_healthy
    volumes:
      - flink-data:/opt/flink/data
      - flink-checkpoints:/opt/flink/checkpoints
    networks:
      - datanest-net

  # ============================================
  # Kafka 4.0.0 单节点（KRaft）— Sprint 10 F4 事件总线（CDC 变更事件管道）
  # 每可订阅管道专属 topic cdc-events-{pipelineId}（分区 1，保留 7d，仅内网不暴露宿主端口）
  # ============================================
  middleware-kafka:
    image: apache/kafka:4.0.0
    container_name: datanest-middleware-kafka
    restart: unless-stopped
    environment:
      # KRaft 单节点：broker 兼 controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://middleware-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@middleware-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # JVM CLI 探针（kafka-broker-api-versions.sh）冷启动可达 50s+，远超超时窗口，改轻量 TCP 探测
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092' 2>/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Test MySQL 8.0 — 数据源 E2E 测试目标库
  # profiles: ["test"] 默认不启动（Sprint 12 ADR-S12-004）；E2E 用 docker compose --profile test up -d
  # ============================================
  middleware-test-mysql:
    image: mysql:8.0
    profiles: ["test"]
    container_name: datanest-middleware-test-mysql
    restart: unless-stopped
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - test-mysql-data:/var/lib/mysql
      - ./scripts/test-mysql-init.sql:/docker-entrypoint-initdb.d/01-test-mysql-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin -u root -proot123 ping | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Test PostgreSQL 16 — 数据源 E2E 测试目标库
  # profiles: ["test"] 默认不启动（Sprint 12 ADR-S12-004）；E2E 用 docker compose --profile test up -d
  # ============================================
  middleware-test-postgres:
    image: postgres:16-alpine
    profiles: ["test"]
    container_name: datanest-middleware-test-postgres
    restart: unless-stopped
    command: postgres -c timezone=Asia/Shanghai -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
      - ./scripts/test-postgres-init.sql:/docker-entrypoint-initdb.d/01-test-postgres-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Nacos 配置初始化（一次性 Job：把 shared-configs/*.yaml 推到 Nacos 配置中心）
  # profiles: ["init"] 默认不启动
  # ============================================
  middleware-nacos-init:
    image: curlimages/curl:latest
    container_name: datanest-middleware-nacos-init
    environment:
      - TZ=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - CONFIG_DIR=/shared-configs
      - NACOS_GROUP=shared-configs
    volumes:
      - ./scripts/init-nacos.sh:/init-nacos.sh:ro
      - ./shared-configs:/shared-configs:ro
    command: [ "sh", "/init-nacos.sh" ]
    depends_on:
      middleware-nacos:
        condition: service_healthy
    networks:
      - datanest-net
    restart: on-failure

  # ============================================
  # Test Oracle 23ai Free — 数据源 E2E 测试目标库
  # 端口 1521；默认用户 testuser/testpass123，SYSTEM/root123
  # 镜像：gvenzl/oracle-free:23-slim（社区免费版，无需授权）
  # 持久化：test-oracle-data 卷
  # 启动慢（start_period=120s），需等 initdb 完成
  # 2026-08-11 停用（资源占用大）；2026-08-12 Sprint 10 F1 数据服务多数据源测试重新启用
  # 2026-08-17 Sprint 12 ADR-S12-004：收敛到 test profile，默认不启动；E2E 用 docker compose --profile test up -d
  # ============================================
  middleware-test-oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["test"]
    container_name: datanest-middleware-test-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: root123
      APP_USER: testuser
      APP_USER_PASSWORD: testpass123
      TZ: Asia/Shanghai
    ports:
      - "1521:1521"
    volumes:
      - test-oracle-data:/opt/oracle/oradata
      - ./scripts/test-oracle-init.sql:/container-entrypoint-initdb.d/01-test-oracle-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s SYSTEM/root123@FREEPDB1 | grep -q '1'" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - datanest-net

  # ============================================
  # Test SQL Server 2022 — 数据源 E2E 测试目标库
  # 端口 1433；SA 密码 YourStrong@Passw0rd（满足强密码策略）
  # 镜像：mcr.microsoft.com/mssql/server:2022-latest
  # 必须 ACCEPT_EULA=Y；用 sqlserver-entrypoint.sh 跑 initdb/*.sql
  # ============================================
  # Sprint 5 临时注释（资源不足）；2026-08-12 Sprint 10 F1 数据服务多数据源测试重新启用
  # 2026-08-17 Sprint 12 ADR-S12-004：收敛到 test profile，默认不启动；E2E 用 docker compose --profile test up -d
  middleware-test-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["test"]
    container_name: datanest-middleware-test-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Express"
      TZ: Asia/Shanghai
    ports:
      - "1433:1433"
    volumes:
      - ./scripts/test-sqlserver-init.sql:/docker-entrypoint-initdb.d/01-test-sqlserver-init.sql:ro
      - ./scripts/sqlserver-entrypoint.sh:/sqlserver-entrypoint.sh:ro
    command: [ "/bin/bash", "/sqlserver-entrypoint.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' | grep -q '1'" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # 应用层 (app-*) — 业务服务
  # ============================================

  # ============================================
  # Gateway — Spring Cloud Gateway（统一入口）
  # 端口: 8080
  # ============================================
  app-gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: datanest-app-gateway
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8080" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # System — 用户与权限服务
  # ============================================
  app-system:
    build:
      context: .
      dockerfile: docker/system.Dockerfile
    container_name: datanest-app-system
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_system
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    # 不暴露宿主机端口，仅通过 app-gateway 访问
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8087" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Alert — 告警中心服务（告警规则/历史 + 邮件发送收拢于此）
  # ============================================
  app-alert:
    build:
      context: .
      dockerfile: docker/alert.Dockerfile
    container_name: datanest-app-alert
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_alert
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
      # MailHog 本地邮件测试
      - MAIL_HOST=datanest-mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=mailhog
      - MAIL_PASSWORD=mailhog
      - MAIL_FROM=test@datanest.local
      - ALERT_ENABLED=true
    # 不暴露宿主机端口：对外统一走 gateway /api/alert/**，容器间 Feign 走 datanest-net:8088
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8088" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Realtime — 实时 CDC 管道服务（Sprint 8 F2：MySQL binlog → Flink CDC → Iceberg 湖仓）
  # ============================================
  app-realtime:
    build:
      context: .
      dockerfile: docker/realtime.Dockerfile
    container_name: datanest-app-realtime
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_realtime
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    # 不暴露宿主机端口：对外统一走 gateway /api/realtime/**，容器间 Feign 走 datanest-net:8089
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      middleware-minio:
        condition: service_healthy
      middleware-flink-jobmanager:
        condition: service_healthy
      app-engineering:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8089" ]
      interval: 10s
      timeout: 5s
      retries: 10
      # Flink 依赖重，启动较慢，给足预热时间
      start_period: 90s
    networks:
      - datanest-net

  # ============================================
  # Data Service — 数据服务（Sprint 10：SQL 终端 / 数据 API / 实时订阅）
  # ============================================
  app-data-service:
    build:
      context: .
      dockerfile: docker/dataservice.Dockerfile
    container_name: datanest-app-data-service
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_dataservice
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    # 不暴露宿主机端口：对外统一走 gateway /api/data-service/**，容器间 Feign 走 datanest-net:8090
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      app-engineering:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8090" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - datanest-net

  # ============================================
  # Engineering — 数据工程服务（同步任务 + Sprint 3 DAG API）
  # ============================================
  app-engineering:
    build:
      context: .
      dockerfile: docker/engineering.Dockerfile
    container_name: datanest-app-engineering
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_engineering
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    # ADR-S3-012：回调走 gateway（app-gateway:8080/api/worker/dev/internal/**），
    # 不再直连 engineering 8082。Docker 内网 gateway 与 app-worker 在同 datanest-net。
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8082" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Governance — 元数据采集与治理服务
  # ============================================
  app-governance:
    build:
      context: .
      dockerfile: docker/governance.Dockerfile
    container_name: datanest-app-governance
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest_governance
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8084" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Runner — 同步任务与元数据采集执行器（避免和 DS worker 重名改 runner）
  # ============================================
  app-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: datanest-app-worker
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      middleware-powerjob:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8085" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - datanest-net
    volumes:
      - ./data/python-sandbox:/tmp/datanest-python-sandbox

  # ============================================
  # Job — 平台定时任务执行器
  # ============================================
  app-job:
    build:
      context: .
      dockerfile: docker/job.Dockerfile
    container_name: datanest-app-job
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      middleware-powerjob:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8086" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # MailHog — 本地邮件测试（SMTP 1025 / Web UI 8025）
  # ============================================
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: datanest-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - datanest-net

  # ============================================
  # Frontend — Nginx 静态资源 + API 反向代理
  # 端口: 3000
  # ============================================
  app-frontend:
    build:
      context: ./data-nest-frontend
      dockerfile: Dockerfile
    container_name: datanest-app-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "3000:80"
    depends_on:
      app-gateway:
        condition: service_healthy
    networks:
      - datanest-net

# ============================================
# Volumes — 持久化数据卷
# 中间件数据卷保留旧名以兼容历史数据
# ============================================
volumes:
  # 兼容历史（保留旧名避免数据丢失）
  nacos-mysql-data:
  nacos-data:
  nacos-logs:
  pgdata:
  redisdata:
  test-mysql-data:
  test-postgres-data:
  # Sprint 8 实时 CDC：Iceberg 湖仓数据 + 元数据
  minio-data:
  # Sprint 8 实时 CDC：Flink 作业数据与 checkpoint
  flink-data:
  flink-checkpoints:
  # Sprint 10 F4 事件总线：Kafka KRaft 数据（topic/offset/日志）
  kafka-data:
  test-oracle-data:
  # PowerJob server 持久化（日志/H2 本地库等）
  powerjob-server-data:

# ============================================
# Networks — 统一网络
# ============================================
networks:
  datanest-net:
    name: datanest-net
