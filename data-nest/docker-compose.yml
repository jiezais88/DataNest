version: "3.8"

services:
  # ============================================
  # Nacos MySQL 8.0 — Nacos 外置持久化数据库
  # ============================================
  nacos-mysql:
    image: mysql:8.0
    container_name: datanest-nacos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: nacos
      MYSQL_USER: nacos
      MYSQL_PASSWORD: nacos123
    ports:
      - "3306:3306"
    volumes:
      - nacos-mysql-data:/var/lib/mysql
      - ./scripts/mysql-schema.sql:/docker-entrypoint-initdb.d/01-mysql-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin -u root -proot123 ping | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Nacos 3.1.1 — 注册 + 配置中心
  # 端口: 8848(主服务) / 9848(gRPC) / 8080(控制台)
  # ============================================
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: datanest-nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=nacos-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos123
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - NACOS_AUTH_ENABLE=false
      - NACOS_AUTH_TOKEN=ZGF0YW5lc3QtbmFjb3Mtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNg==
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8081:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
      - ./tmp/logs/nacos:/home/nacos/logs
    depends_on:
      nacos-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/ns/operator/metrics | grep -q 'UP'" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # PostgreSQL 16 — 用户权限元数据库
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: datanest-postgres
    environment:
      POSTGRES_USER: datanest
      POSTGRES_PASSWORD: datanest123
      POSTGRES_DB: datanest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U datanest" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Redis 7 — Sa-Token 会话存储
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: datanest-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Gateway — Spring Cloud Gateway
  # ============================================
  gateway:
    build:
      context: ./data-nest-gateway
      dockerfile: Dockerfile
    container_name: datanest-gateway
    environment:
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8080" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # System — 用户与权限服务
  # ============================================
  system:
    build:
      context: ./data-nest-system
      dockerfile: Dockerfile
    container_name: datanest-system
    environment:
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8087:8087"
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8087" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Frontend — Nginx 静态资源 + API 反向代理
  # ============================================
  frontend:
    build:
      context: ./data-nest-frontend
      dockerfile: Dockerfile
    container_name: datanest-frontend
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - datanest-net

  # ============================================
  # Nacos 配置初始化（一次性 Job）
  # ============================================
  nacos-init:
    image: curlimages/curl:latest
    container_name: datanest-nacos-init
    environment:
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - CONFIG_DIR=/shared-configs
      - NACOS_GROUP=shared-configs
    volumes:
      - ./scripts/init-nacos.sh:/init-nacos.sh:ro
      - ./shared-configs:/shared-configs:ro
    command: [ "sh", "/init-nacos.sh" ]
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - datanest-net
    restart: "no"

volumes:
  nacos-mysql-data:
  nacos-data:
  nacos-logs:
  pgdata:
  redisdata:

networks:
  datanest-net:
    name: datanest-net
