services:
  # ============================================
  # 中间件层 (middleware-*) — 基础设施服务
  # ============================================
  # 命名规范: <项目>-<模块>-<服务>
  #   - middleware-* = 基础设施（DB/Cache/Registry/调度）
  #   - app-*        = 业务应用（gateway/system/data/frontend/ds）
  # volume 命名保留旧名(nacos-mysql-data/pgdata/...)以兼容历史数据

  # ============================================
  # MySQL 8.0 — 统一数据库（Nacos + PowerJob + 测试库都复用）
  # ============================================
  middleware-mysql:
    image: mysql:8.0
    container_name: datanest-middleware-mysql
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: nacos
      MYSQL_USER: nacos
      MYSQL_PASSWORD: nacos123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - nacos-mysql-data:/var/lib/mysql
      - ./scripts/nacos-mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-mysql-schema.sql:ro
      - ./scripts/init-powerjob-db.sql:/docker-entrypoint-initdb.d/02-init-powerjob-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin -u root -proot123 ping | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Nacos 3.1.1 — 注册 + 配置中心
  # 端口: 8848(主服务) / 9848(gRPC) / 8081(控制台映射 8080)
  # ============================================
  middleware-nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: datanest-middleware-nacos
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=middleware-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos123
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=ZGF0YW5lc3QtbmFjb3Mtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNg==
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8081:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
      - ./tmp/logs/nacos:/home/nacos/logs
    depends_on:
      middleware-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/ns/operator/metrics | grep -q 'UP'" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # PowerJob 5.1.2 — 统一调度中心（已替换 XXL-JOB + DolphinScheduler）
  # 复用 middleware-mysql 的 powerjob 库（14 张表，官方 powerjob-mysql.sql 初始化）
  # 注意：PowerJob 数据源配置前缀是 spring.datasource.core.*（非标准 spring.datasource.*）
  # 端口: 7700 (控制台+OpenAPI) / 10010 (HTTP transporter) / 10086 (AKKA transporter)
  # ============================================
  middleware-powerjob:
    image: powerjob/powerjob-server:5.1.2
    container_name: datanest-middleware-powerjob
    environment:
      - TZ=Asia/Shanghai
      - JVMOPTIONS=-Xmx512m
      - PARAMS=--oms.mongodb.enable=false --spring.datasource.core.jdbc-url=jdbc:mysql://middleware-mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.core.username=nacos --spring.datasource.core.password=nacos123 --oms.storage.dfs.mysql_series.url=jdbc:mysql://middleware-mysql:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --oms.storage.dfs.mysql_series.username=nacos --oms.storage.dfs.mysql_series.password=nacos123 --oms.storage.dfs.mysql_series.auto_create_table=true
    ports:
      - "7700:7700"
      - "10010:10010"
      - "10086:10086"
    volumes:
      - powerjob-server-data:/root/powerjob/server/
    depends_on:
      middleware-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7700/ > /dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - datanest-net

  # ============================================
  # PostgreSQL 16 — DataNest 业务数据主库（用户/权限/同步任务/DAG 等）
  # ============================================
  middleware-postgres:
    image: postgres:16-alpine
    container_name: datanest-middleware-postgres
    command: postgres -c timezone=Asia/Shanghai
    environment:
      POSTGRES_USER: datanest
      POSTGRES_PASSWORD: datanest123
      POSTGRES_DB: datanest
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U datanest" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Redis 7 — Sa-Token 会话存储 + Sprint 3 DAG 互斥锁（SETNX）
  # ============================================
  middleware-redis:
    image: redis:7-alpine
    container_name: datanest-middleware-redis
    command: redis-server --appendonly yes --appendfsync everysec
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Test MySQL 8.0 — 数据源 E2E 测试目标库
  # ============================================
  middleware-test-mysql:
    image: mysql:8.0
    container_name: datanest-middleware-test-mysql
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - test-mysql-data:/var/lib/mysql
      - ./scripts/test-mysql-init.sql:/docker-entrypoint-initdb.d/01-test-mysql-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin -u root -proot123 ping | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Test PostgreSQL 16 — 数据源 E2E 测试目标库
  # ============================================
  middleware-test-postgres:
    image: postgres:16-alpine
    container_name: datanest-middleware-test-postgres
    command: postgres -c timezone=Asia/Shanghai
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
      - ./scripts/test-postgres-init.sql:/docker-entrypoint-initdb.d/01-test-postgres-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Nacos 配置初始化（一次性 Job：把 shared-configs/*.yaml 推到 Nacos 配置中心）
  # profiles: ["init"] 默认不启动
  # ============================================
  middleware-nacos-init:
    image: curlimages/curl:latest
    container_name: datanest-middleware-nacos-init
    environment:
      - TZ=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - CONFIG_DIR=/shared-configs
      - NACOS_GROUP=shared-configs
    volumes:
      - ./scripts/init-nacos.sh:/init-nacos.sh:ro
      - ./shared-configs:/shared-configs:ro
    command: [ "sh", "/init-nacos.sh" ]
    depends_on:
      middleware-nacos:
        condition: service_healthy
    networks:
      - datanest-net
    restart: "no"

  # ============================================
  # Test Oracle 23ai Free — 数据源 E2E 测试目标库
  # 端口 1521；默认用户 testuser/testpass123，SYSTEM/root123
  # 镜像：gvenzl/oracle-free:23-slim（社区免费版，无需授权）
  # 持久化：test-oracle-data 卷
  # 启动慢（start_period=120s），需等 initdb 完成
  # ============================================
  # Sprint 5 临时注释：本机资源不足，暂不启动 Oracle
  # middleware-test-oracle:
  #   image: gvenzl/oracle-free:23-slim
  #   container_name: datanest-middleware-test-oracle
  #   environment:
  #     ORACLE_PASSWORD: root123
  #     APP_USER: testuser
  #     APP_USER_PASSWORD: testpass123
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "1521:1521"
  #   volumes:
  #     - test-oracle-data:/opt/oracle/oradata
  #     - ./scripts/test-oracle-init.sql:/container-entrypoint-initdb.d/01-test-oracle-init.sql:ro
  #   healthcheck:
  #     test: [ "CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s SYSTEM/root123@FREEPDB1 | grep -q '1'" ]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 20
  #     start_period: 120s
  #   networks:
  #     - datanest-net

  # ============================================
  # Test SQL Server 2022 — 数据源 E2E 测试目标库
  # 端口 1433；SA 密码 YourStrong@Passw0rd（满足强密码策略）
  # 镜像：mcr.microsoft.com/mssql/server:2022-latest
  # 必须 ACCEPT_EULA=Y；用 sqlserver-entrypoint.sh 跑 initdb/*.sql
  # ============================================
  # Sprint 5 临时注释：本机资源不足，暂不启动 SQL Server
  # middleware-test-sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: datanest-middleware-test-sqlserver
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
  #     MSSQL_PID: "Express"
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "1433:1433"
  #   volumes:
  #     - ./scripts/test-sqlserver-init.sql:/docker-entrypoint-initdb.d/01-test-sqlserver-init.sql:ro
