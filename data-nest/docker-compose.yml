services:
  # ============================================
  # 中间件层 (middleware-*) — 基础设施服务
  # ============================================
  # 命名规范: <项目>-<模块>-<服务>
  #   - middleware-* = 基础设施（DB/Cache/Registry/调度）
  #   - app-*        = 业务应用（gateway/system/data/frontend/ds）
  # volume 命名保留旧名(nacos-mysql-data/pgdata/...)以兼容历史数据

  # ============================================
  # MySQL 8.0 — 统一数据库（Nacos + XXL-JOB + DS schema + 测试库都复用）
  # ============================================
  middleware-mysql:
    image: mysql:8.0
    container_name: datanest-middleware-mysql
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: nacos
      MYSQL_USER: nacos
      MYSQL_PASSWORD: nacos123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - nacos-mysql-data:/var/lib/mysql
      - ./scripts/nacos-mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-mysql-schema.sql:ro
      - ./scripts/init-scheduler-db.sql:/docker-entrypoint-initdb.d/02-init-scheduler-db.sql:ro
      - ./scripts/init-xxl-job-tables.sql:/docker-entrypoint-initdb.d/03-init-xxl-job-tables.sql:ro
      - ./scripts/init-dolphinscheduler-db.sql:/docker-entrypoint-initdb.d/04-init-ds-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin -u root -proot123 ping | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Nacos 3.1.1 — 注册 + 配置中心
  # 端口: 8848(主服务) / 9848(gRPC) / 8081(控制台映射 8080)
  # ============================================
  middleware-nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: datanest-middleware-nacos
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=middleware-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos123
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=ZGF0YW5lc3QtbmFjb3Mtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNg==
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8081:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
      - ./tmp/logs/nacos:/home/nacos/logs
    depends_on:
      middleware-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/ns/operator/metrics | grep -q 'UP'" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # XXL-JOB 3.4.2 — 统一调度中心（Sprint 1-2 同步/采集任务调度）
  # 复用 middleware-mysql 的 datanest_scheduler 库
  # 端口: 8088 (Admin Web)
  # ============================================
  middleware-xxljob:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: datanest-middleware-xxljob
    environment:
      - TZ=Asia/Shanghai
      - PARAMS=--spring.datasource.url=jdbc:mysql://middleware-mysql:3306/datanest_scheduler?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=nacos --spring.datasource.password=nacos123 --xxl.job.accessToken=default_token
    ports:
      - "8088:8080"
    volumes:
      - xxl-job-admin-data:/data/applogs
    depends_on:
      middleware-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -L http://localhost:8080/ | grep -q 'XXL-JOB'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # PostgreSQL 16 — DataNest 业务数据主库（用户/权限/同步任务/DAG 等）
  # ============================================
  middleware-postgres:
    image: postgres:16-alpine
    container_name: datanest-middleware-postgres
    command: postgres -c timezone=Asia/Shanghai
    environment:
      POSTGRES_USER: datanest
      POSTGRES_PASSWORD: datanest123
      POSTGRES_DB: datanest
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U datanest" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Redis 7 — Sa-Token 会话存储 + Sprint 3 DAG 互斥锁（SETNX）
  # ============================================
  middleware-redis:
    image: redis:7-alpine
    container_name: datanest-middleware-redis
    command: redis-server --appendonly yes --appendfsync everysec
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Test MySQL 8.0 — 数据源 E2E 测试目标库
  # ============================================
  middleware-test-mysql:
    image: mysql:8.0
    container_name: datanest-middleware-test-mysql
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - test-mysql-data:/var/lib/mysql
      - ./scripts/test-mysql-init.sql:/docker-entrypoint-initdb.d/01-test-mysql-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin -u root -proot123 ping | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Test PostgreSQL 16 — 数据源 E2E 测试目标库
  # ============================================
  middleware-test-postgres:
    image: postgres:16-alpine
    container_name: datanest-middleware-test-postgres
    command: postgres -c timezone=Asia/Shanghai
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
      - ./scripts/test-postgres-init.sql:/docker-entrypoint-initdb.d/01-test-postgres-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Zookeeper 3.8 — DolphinScheduler 3.4.2 注册中心
  # DS 3.x 必须配外部注册中心（zookeeper/etcd/nacos），standalone 模式已废弃
  # 端口: 2181 (client) / 2888 (follower) / 3888 (election)
  # 持久化: /data (内存数据快照) + /datalog (事务日志)
  # ============================================
  middleware-zookeeper:
    image: zookeeper:3.8
    container_name: datanest-middleware-zookeeper
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "2181:2181"
    volumes:
      - datanest-zk-data:/data
      - datanest-zk-datalog:/datalog
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 2181 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # DS Schema Init — 一次性 DolphinScheduler 元数据初始化（64 张表）
  # profiles: ["init"] 默认不启动，需要时: docker compose --profile init up middleware-ds-schema-init
  # DS 镜像默认不带 MySQL driver（GPLv2 vs Apache 2.0 协议冲突），
  # 需要手动挂载 mysql-connector-j jar 到 /opt/dolphinscheduler/tools/libs/
  # ============================================
  middleware-ds-schema-init:
    image: apache/dolphinscheduler-tools:3.4.2
    container_name: datanest-middleware-ds-schema-init
    environment:
      - TZ=Asia/Shanghai
      - DATABASE=mysql
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://middleware-mysql:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=nacos
      - SPRING_DATASOURCE_PASSWORD=nacos123
      - REGISTRY_TYPE=zookeeper
      - REGISTRY_ZOOKEEPER_CONNECT_STRING=middleware-zookeeper:2181
    volumes:
      - ./shared-configs/libs/mysql-connector-j-8.0.33.jar:/opt/dolphinscheduler/tools/libs/mysql-connector-j-8.0.33.jar:ro
    # 直接调用升级脚本（DS 镜像内 sh 不可用，但脚本本身可执行）
    command: [ "tools/bin/upgrade-schema.sh" ]
    depends_on:
      middleware-mysql:
        condition: service_healthy
      middleware-zookeeper:
        condition: service_healthy
    networks:
      - datanest-net
    restart: "no"

  # ============================================
  # Nacos 配置初始化（一次性 Job：把 shared-configs/*.yaml 推到 Nacos 配置中心）
  # profiles: ["init"] 默认不启动
  # ============================================
  middleware-nacos-init:
    image: curlimages/curl:latest
    container_name: datanest-middleware-nacos-init
    environment:
      - TZ=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - CONFIG_DIR=/shared-configs
      - NACOS_GROUP=shared-configs
    volumes:
      - ./scripts/init-nacos.sh:/init-nacos.sh:ro
      - ./shared-configs:/shared-configs:ro
    command: [ "sh", "/init-nacos.sh" ]
    depends_on:
      middleware-nacos:
        condition: service_healthy
    networks:
      - datanest-net
    restart: "no"

  # ============================================
  # Test Oracle 23ai Free — 数据源 E2E 测试目标库
  # 端口 1521；默认用户 testuser/testpass123，SYSTEM/root123
  # 镜像：gvenzl/oracle-free:23-slim（社区免费版，无需授权）
  # 持久化：test-oracle-data 卷
  # 启动慢（start_period=120s），需等 initdb 完成
  # ============================================
  # Sprint 5 临时注释：本机资源不足，暂不启动 Oracle
  # middleware-test-oracle:
  #   image: gvenzl/oracle-free:23-slim
  #   container_name: datanest-middleware-test-oracle
  #   environment:
  #     ORACLE_PASSWORD: root123
  #     APP_USER: testuser
  #     APP_USER_PASSWORD: testpass123
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "1521:1521"
  #   volumes:
  #     - test-oracle-data:/opt/oracle/oradata
  #     - ./scripts/test-oracle-init.sql:/container-entrypoint-initdb.d/01-test-oracle-init.sql:ro
  #   healthcheck:
  #     test: [ "CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s SYSTEM/root123@FREEPDB1 | grep -q '1'" ]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 20
  #     start_period: 120s
  #   networks:
  #     - datanest-net

  # ============================================
  # Test SQL Server 2022 — 数据源 E2E 测试目标库
  # 端口 1433；SA 密码 YourStrong@Passw0rd（满足强密码策略）
  # 镜像：mcr.microsoft.com/mssql/server:2022-latest
  # 必须 ACCEPT_EULA=Y；用 sqlserver-entrypoint.sh 跑 initdb/*.sql
  # ============================================
  # Sprint 5 临时注释：本机资源不足，暂不启动 SQL Server
  # middleware-test-sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: datanest-middleware-test-sqlserver
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
  #     MSSQL_PID: "Express"
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "1433:1433"
  #   volumes:
  #     - ./scripts/test-sqlserver-init.sql:/docker-entrypoint-initdb.d/01-test-sqlserver-init.sql:ro
  #     - ./scripts/sqlserver-entrypoint.sh:/sqlserver-entrypoint.sh:ro
  #   command: [ "/bin/bash", "/sqlserver-entrypoint.sh" ]
  #   healthcheck:
  #     test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' | grep -q '1'" ]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 20
  #     start_period: 60s
  #   networks:
  #     - datanest-net

  # ============================================
  # 应用层 (app-*) — 业务服务
  # ============================================

  # ============================================
  # Gateway — Spring Cloud Gateway（统一入口）
  # 端口: 8080
  # ============================================
  app-gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: datanest-app-gateway
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8080" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # System — 用户与权限服务
  # ============================================
  app-system:
    build:
      context: .
      dockerfile: docker/system.Dockerfile
    container_name: datanest-app-system
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
    # 不暴露宿主机端口，仅通过 app-gateway 访问
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8087" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # DolphinScheduler 3.4.2 — DAG 调度与执行引擎
  # Master + Worker + API + Alert 分离架构
  # 注册中心：Zookeeper（必须）
  # 端口: 12345 (API Web UI)
  # 数据库复用 middleware-mysql（dolphinscheduler 库 64 张表）
  # DS 镜像不带 MySQL JDBC（GPLv2 vs Apache 2.0 协议冲突，官方禁止内置），
  # 3.4.2 classpath 是 $DOLPHINSCHEDULER_HOME/<server>-server/libs/*，
  # 挂 jar 到每个 server 自己的 libs 子目录
  # 持久化: /opt/dolphinscheduler/logs (4 服务共享), /opt/soft (master/worker 共享)
  # ============================================
  middleware-ds-api:
    image: apache/dolphinscheduler-api:3.4.2
    container_name: datanest-middleware-ds-api
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://middleware-mysql:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=nacos
      - SPRING_DATASOURCE_PASSWORD=nacos123
      - REGISTRY_TYPE=zookeeper
      - REGISTRY_ZOOKEEPER_CONNECT_STRING=middleware-zookeeper:2181
    ports:
      - "12345:12345"
    volumes:
      - datanest-ds-logs:/opt/dolphinscheduler/logs
      - ./shared-configs/libs/mysql-connector-j-8.0.33.jar:/opt/dolphinscheduler/api-server/libs/mysql-connector-j-8.0.33.jar:ro
    depends_on:
      middleware-mysql:
        condition: service_healthy
      middleware-zookeeper:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:12345/dolphinscheduler/actuator/health | grep -q 'UP'" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - datanest-net

  middleware-ds-master:
    image: apache/dolphinscheduler-master:3.4.2
    container_name: datanest-middleware-ds-master
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://middleware-mysql:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=nacos
      - SPRING_DATASOURCE_PASSWORD=nacos123
      - REGISTRY_TYPE=zookeeper
      - REGISTRY_ZOOKEEPER_CONNECT_STRING=middleware-zookeeper:2181
      # DS master 过载保护：当前容器内存不足，先关闭以避免 "cannot consumes commands"
      - MASTER_SERVER_LOAD_PROTECTION_ENABLED=false
    volumes:
      - datanest-ds-logs:/opt/dolphinscheduler/logs
      - datanest-ds-shared:/opt/soft
      - ./shared-configs/libs/mysql-connector-j-8.0.33.jar:/opt/dolphinscheduler/master-server/libs/mysql-connector-j-8.0.33.jar:ro
    depends_on:
      middleware-mysql:
        condition: service_healthy
      middleware-zookeeper:
        condition: service_healthy
      middleware-ds-api:
        condition: service_started
    networks:
      - datanest-net

  middleware-ds-worker:
    image: apache/dolphinscheduler-worker:3.4.2
    container_name: datanest-middleware-ds-worker
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://middleware-mysql:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=nacos
      - SPRING_DATASOURCE_PASSWORD=nacos123
      - REGISTRY_TYPE=zookeeper
      - REGISTRY_ZOOKEEPER_CONNECT_STRING=middleware-zookeeper:2181
      - ALERT_SERVER_HOST=middleware-ds-alert
      # DS worker 过载保护：当前容器资源紧张，先关闭以避免 worker 被标记为 BUSY 不接收任务
      - WORKER_SERVER_LOAD_PROTECTION_ENABLED=false
    volumes:
      - datanest-ds-logs:/opt/dolphinscheduler/logs
      - datanest-ds-shared:/opt/soft
      - ./shared-configs/libs/mysql-connector-j-8.0.33.jar:/opt/dolphinscheduler/worker-server/libs/mysql-connector-j-8.0.33.jar:ro
    depends_on:
      middleware-mysql:
        condition: service_healthy
      middleware-zookeeper:
        condition: service_healthy
      middleware-ds-api:
        condition: service_started
    networks:
      - datanest-net

  middleware-ds-alert:
    image: apache/dolphinscheduler-alert-server:3.4.2
    container_name: datanest-middleware-ds-alert
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://middleware-mysql:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=nacos
      - SPRING_DATASOURCE_PASSWORD=nacos123
      - REGISTRY_TYPE=zookeeper
      - REGISTRY_ZOOKEEPER_CONNECT_STRING=middleware-zookeeper:2181
    volumes:
      - datanest-ds-logs:/opt/dolphinscheduler/logs
      - ./shared-configs/libs/mysql-connector-j-8.0.33.jar:/opt/dolphinscheduler/alert-server/libs/mysql-connector-j-8.0.33.jar:ro
    depends_on:
      middleware-mysql:
        condition: service_healthy
      middleware-zookeeper:
        condition: service_healthy
    networks:
      - datanest-net

  # ============================================
  # Engineering — 数据工程服务（同步任务 + Sprint 3 DAG API）
  # ============================================
  app-engineering:
    build:
      context: .
      dockerfile: docker/engineering.Dockerfile
    container_name: datanest-app-engineering
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
      - XXL_JOB_HOST=middleware-xxljob
      - XXL_JOB_PORT=8080
      # MailHog 本地邮件测试
      - MAIL_HOST=datanest-mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=mailhog
      - MAIL_PASSWORD=mailhog
      - MAIL_FROM=test@datanest.local
      - ALERT_ENABLED=true
    # ADR-S3-012：回调走 gateway（app-gateway:8080/api/worker/dev/internal/**），
    # 不再直连 engineering 8082。Docker 内网 gateway 与 app-worker 在同 datanest-net。
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      middleware-xxljob:
        condition: service_healthy
      middleware-test-mysql:
        condition: service_healthy
      middleware-test-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8082" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Governance — 元数据采集与治理服务
  # ============================================
  app-governance:
    build:
      context: .
      dockerfile: docker/governance.Dockerfile
    container_name: datanest-app-governance
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
      - XXL_JOB_HOST=middleware-xxljob
      - XXL_JOB_PORT=8080
    depends_on:
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      middleware-xxljob:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8084" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Runner — 同步任务与元数据采集执行器（避免和 DS worker 重名改 runner）
  # ============================================
  app-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: datanest-app-worker
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
      - XXL_JOB_HOST=middleware-xxljob
      - XXL_JOB_PORT=8080
      # MailHog 本地邮件测试
      - MAIL_HOST=datanest-mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=mailhog
      - MAIL_PASSWORD=mailhog
      - MAIL_FROM=test@datanest.local
      - ALERT_ENABLED=true
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      middleware-xxljob:
        condition: service_healthy
      middleware-test-mysql:
        condition: service_healthy
      middleware-test-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8085" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net
    volumes:
      - ./data/python-sandbox:/tmp/datanest-python-sandbox

  # ============================================
  # Job — 平台定时任务执行器
  # ============================================
  app-job:
    build:
      context: .
      dockerfile: docker/job.Dockerfile
    container_name: datanest-app-job
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=middleware-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - PG_HOST=middleware-postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=middleware-redis
      - REDIS_PORT=6379
      - XXL_JOB_HOST=middleware-xxljob
      - XXL_JOB_PORT=8080
      # MailHog 本地邮件测试
      - MAIL_HOST=datanest-mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=mailhog
      - MAIL_PASSWORD=mailhog
      - MAIL_FROM=test@datanest.local
      - ALERT_ENABLED=true
    depends_on:
      mailhog:
        condition: service_started
      middleware-nacos:
        condition: service_healthy
      middleware-nacos-init:
        condition: service_completed_successfully
      middleware-postgres:
        condition: service_healthy
      middleware-redis:
        condition: service_healthy
      middleware-xxljob:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8086" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # MailHog — 本地邮件测试（SMTP 1025 / Web UI 8025）
  # ============================================
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: datanest-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - datanest-net

  # ============================================
  # Frontend — Nginx 静态资源 + API 反向代理
  # 端口: 3000
  # ============================================
  app-frontend:
    build:
      context: ./data-nest-frontend
      dockerfile: Dockerfile
    container_name: datanest-app-frontend
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "3000:80"
    depends_on:
      app-gateway:
        condition: service_healthy
      app-engineering:
        condition: service_healthy
      app-governance:
        condition: service_healthy
      app-worker:
        condition: service_healthy
      app-job:
        condition: service_healthy
    networks:
      - datanest-net

# ============================================
# Volumes — 持久化数据卷
# 中间件数据卷保留旧名以兼容历史数据；新增 DS+ZK 持久化卷
# ============================================
volumes:
  # 兼容历史（保留旧名避免数据丢失）
  nacos-mysql-data:
  nacos-data:
  nacos-logs:
  pgdata:
  redisdata:
  test-mysql-data:
  test-postgres-data:
  # test-oracle-data:  # Sprint 5 临时注释：Oracle 服务已停用
  xxl-job-admin-data:
  # 新增 — DS 日志+资源（4 个 DS 服务共享 /opt/dolphinscheduler/logs；master/worker 共享 /opt/soft）
  datanest-ds-logs:
  datanest-ds-shared:
  # 新增 — ZK 持久化（/data 内存快照 + /datalog 事务日志）
  datanest-zk-data:
  datanest-zk-datalog:

# ============================================
# Networks — 统一网络
# ============================================
networks:
  datanest-net:
    name: datanest-net
