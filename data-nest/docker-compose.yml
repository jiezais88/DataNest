services:
  # ============================================
  # Nacos MySQL 8.0 — Nacos 外置持久化数据库
  # ============================================
  nacos-mysql:
    image: mysql:8.0
    container_name: datanest-nacos-mysql
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: nacos
      MYSQL_USER: nacos
      MYSQL_PASSWORD: nacos123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - nacos-mysql-data:/var/lib/mysql
      - ./scripts/nacos-mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-mysql-schema.sql:ro
      - ./scripts/init-scheduler-db.sql:/docker-entrypoint-initdb.d/02-init-scheduler-db.sql:ro
      - ./scripts/init-xxl-job-tables.sql:/docker-entrypoint-initdb.d/03-init-xxl-job-tables.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin -u root -proot123 ping | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Nacos 3.1.1 — 注册 + 配置中心
  # 端口: 8848(主服务) / 9848(gRPC) / 8080(控制台)
  # ============================================
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: datanest-nacos
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=nacos-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos123
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - NACOS_AUTH_ENABLE=false
      - NACOS_AUTH_TOKEN=ZGF0YW5lc3QtbmFjb3Mtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNg==
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8081:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
      - ./tmp/logs/nacos:/home/nacos/logs
    depends_on:
      nacos-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/ns/operator/metrics | grep -q 'UP'" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # XXL-JOB 3.4.2 — 统一调度中心
  # 复用 nacos-mysql 的 datanest_scheduler 库
  # 端口: 8088 (Admin Web)
  # ============================================
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: datanest-xxl-job-admin
    environment:
      - TZ=Asia/Shanghai
      - PARAMS=--spring.datasource.url=jdbc:mysql://nacos-mysql:3306/datanest_scheduler?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=nacos --spring.datasource.password=nacos123 --xxl.job.accessToken=default_token
    ports:
      - "8088:8080"
    volumes:
      - xxl-job-admin-data:/data/applogs
    depends_on:
      nacos-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -L http://localhost:8080/ | grep -q 'XXL-JOB'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net
  postgres:
    image: postgres:16-alpine
    container_name: datanest-postgres
    command: postgres -c timezone=Asia/Shanghai
    environment:
      POSTGRES_USER: datanest
      POSTGRES_PASSWORD: datanest123
      POSTGRES_DB: datanest
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U datanest" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Redis 7 — Sa-Token 会话存储
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: datanest-redis
    command: redis-server --appendonly yes --appendfsync everysec
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datanest-net

  # ============================================
  # Gateway — Spring Cloud Gateway
  # ============================================
  gateway:
    build:
      context: ./data-nest-gateway
      dockerfile: Dockerfile
    container_name: datanest-gateway
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8080" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # System — 用户与权限服务
  # ============================================
  system:
    build:
      context: ./data-nest-system
      dockerfile: Dockerfile
    container_name: datanest-system
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    # 不暴露宿主机端口，仅通过 Gateway 访问
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8087" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Test MySQL 8.0 — 数据源 E2E 测试目标库
  # ============================================
  test-mysql:
    image: mysql:8.0
    container_name: datanest-test-mysql
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - test-mysql-data:/var/lib/mysql
      - ./scripts/test-mysql-init.sql:/docker-entrypoint-initdb.d/01-test-mysql-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin -u root -proot123 ping | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Test PostgreSQL 16 — 数据源 E2E 测试目标库
  # ============================================
  test-postgres:
    image: postgres:16-alpine
    container_name: datanest-test-postgres
    command: postgres -c timezone=Asia/Shanghai
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
      - ./scripts/test-postgres-init.sql:/docker-entrypoint-initdb.d/01-test-postgres-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - datanest-net

  # ============================================
  # Engineering — 数据工程服务
  # ============================================
  engineering:
    build:
      context: ./data-nest-engineering
      dockerfile: Dockerfile
    container_name: datanest-engineering
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - XXL_JOB_HOST=xxl-job-admin
      - XXL_JOB_PORT=8080
    # 不暴露宿主机端口，仅通过 Gateway 访问
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
      test-mysql:
        condition: service_healthy
      test-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8082" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Governance — 元数据采集与治理服务
  # ============================================
  governance:
    build:
      context: ./data-nest-governance
      dockerfile: Dockerfile
    container_name: datanest-governance
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - XXL_JOB_HOST=xxl-job-admin
      - XXL_JOB_PORT=8080
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8084" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Worker — 同步任务与元数据采集执行器
  # ============================================
  worker:
    build:
      context: ./data-nest-worker
      dockerfile: Dockerfile
    container_name: datanest-worker
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - XXL_JOB_HOST=xxl-job-admin
      - XXL_JOB_PORT=8080
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
      test-mysql:
        condition: service_healthy
      test-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8085" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Job — 平台定时任务执行器
  # ============================================
  job:
    build:
      context: ./data-nest-job
      dockerfile: Dockerfile
    container_name: datanest-job
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=datanest
      - PG_PASSWORD=datanest123
      - PG_DATABASE=datanest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - XXL_JOB_HOST=xxl-job-admin
      - XXL_JOB_PORT=8080
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8086" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - datanest-net

  # ============================================
  # Frontend — Nginx 静态资源 + API 反向代理
  # ============================================
  frontend:
    build:
      context: ./data-nest-frontend
      dockerfile: Dockerfile
    container_name: datanest-frontend
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
      engineering:
        condition: service_healthy
      governance:
        condition: service_healthy
      worker:
        condition: service_healthy
      job:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - datanest-net

  # ============================================
  # Nacos 配置初始化（一次性 Job）
  # ============================================
  nacos-init:
    image: curlimages/curl:latest
    container_name: datanest-nacos-init
    environment:
      - TZ=Asia/Shanghai
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - CONFIG_DIR=/shared-configs
      - NACOS_GROUP=shared-configs
    volumes:
      - ./scripts/init-nacos.sh:/init-nacos.sh:ro
      - ./shared-configs:/shared-configs:ro
    command: [ "sh", "/init-nacos.sh" ]
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - datanest-net
    restart: "no"

volumes:
  nacos-mysql-data:
  nacos-data:
  nacos-logs:
  pgdata:
  redisdata:
  test-mysql-data:
  test-postgres-data:
  xxl-job-admin-data:

networks:
  datanest-net:
    name: datanest-net
