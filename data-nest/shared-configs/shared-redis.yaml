# ============================================
# shared-redis.yaml
# Redis 共享配置
# 消费方: gateway, system-service, engineering-service, governance-service
# ============================================
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
