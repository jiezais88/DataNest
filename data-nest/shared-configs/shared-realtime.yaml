# ============================================
# shared-realtime.yaml
# 实时 CDC 管道（Flink 集群 / Iceberg 湖仓 / 监控轮询）
# 消费方: app-realtime
# ============================================
datanest:
  realtime:
    flink:
      jobmanager-url: http://middleware-flink-jobmanager:8081
      parallelism: 1
      checkpoint-interval-ms: 30000
    iceberg:
      warehouse: s3a://datalake/warehouse
      catalog-name: datalake_catalog
    monitor:
      interval-ms: 5000
      # Sprint 9：作业查询连续 404 轮次阈值，达到才归并「外部停止」（防 Flink 集群短暂抖动误伤，T4）
      not-found-threshold: 3
    metric:
      # Sprint 9：cdc_metric_minute 指标历史保留天数（T1，每日 03:40 清理）
      retention-days: 30
    lag:
      warn-threshold: 30
