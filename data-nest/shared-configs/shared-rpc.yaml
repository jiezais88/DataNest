# ============================================
# shared-rpc.yaml
# 服务间调用：内部令牌 + Feign 超时/重试/熔断
# 消费方：system / alert-service / engineering / governance / worker / job
# （由 shared-internal.yaml + shared-feign.yaml 合并而来）
# ============================================

datanest:
  internal:
    # 内部调用令牌：生产环境务必通过 DATANEST_INTERNAL_TOKEN 环境变量覆盖默认值
    token: ${DATANEST_INTERNAL_TOKEN:datanest-internal-dev-token}

# Feign 全局容错配置
# 注意：Spring Cloud OpenFeign 5.x（Boot 4）已移除旧 feign.* 命名空间，
#       必须使用 spring.cloud.openfeign.*，否则配置静默失效（circuitbreaker 不装配会导致 fallbackFactory 不生效）。
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: basic
      circuitbreaker:
        enabled: true
      httpclient:
        hc5:
          # Apache HttpClient 5 连接池（feign-hc5 依赖经各 api 模块传递）：
          # 替代默认无池的 JDK HttpURLConnection，服务间调用复用 TCP 连接
          enabled: true
          time-to-live: 900
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
