# DataNest — shared-dolphinscheduler.yaml
# Sprint 3 引入：DolphinScheduler 3.4.2 集成配置
# 加载方式：data-nest-engineering application.yml 通过 nacos config import 引入
# 命名空间：shared-configs（与其他 shared-*.yaml 一致）

datanest:
  dolphinscheduler:
    # DS API Server 地址（Docker 内网服务名：middleware-ds-api）
    api-url: http://middleware-ds-api:12345/dolphinscheduler
    # DS 登录 Token：通过 DS Admin 创建用户后获取，或启动脚本自动生成
    # 2026-07-30 初始化: admin 用户的 access token，expire 2030-01-01
    token: ${DS_API_TOKEN:datanest-ds-token-2026}
    # DS 租户编码：DataNest 业务租户（datanest, id=1），从 default 改成 datanest
    tenant-code: ${DS_TENANT_CODE:datanest}
    # DAG 节点回调 engineering 的超时时间（秒）
    callback-timeout-seconds: 1800
    # 状态轮询间隔（后端 → DS）
    poll-interval-ms: 5000
    # 启用内部接口鉴权开关（生产环境应开启；开发阶段 false）
    # internal-auth-enabled: false
