# ============================================
# shared-security.yaml
# Sa-Token JWT + CORS + 加密密钥共享配置
# 消费方: gateway / system / alert-service / engineering / governance / worker / job
# ============================================
sa-token:
  # JWT 模式
  jwt-secret-key: ${JWT_SECRET:DataNestSecretKey2026!ChangeMeInProduction}
  # Token 名称，前端放在同名 Header 中提交：Authorization: <token>
  token-name: Authorization
  # 关闭 Cookie 读取，统一走 Header（前后端分离）
  is-read-cookie: false
  # 开启从请求头读取 Token
  is-read-header: true
  # Token 有效期 (秒)，默认 7 天
  timeout: 604800
  # 临时有效期 (秒)，默认 30 分钟
  active-timeout: 1800
  # 开启动态临时有效期：登录时可对单 token 覆盖 active-timeout（记住我场景豁免无操作冻结）
  dynamic-active-timeout: true
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 是否共用一个 Token
  is-share: true
  # Token 风格: tik (UUID 风格)
  token-style: tik
  # 是否输出日志
  is-log: true

datanest:
  security:
    cors:
      allowed-origins: ${CORS_ORIGINS:*}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-User-Id
      allow-credentials: true
      max-age: 3600
    encryption:
      # AES-256-GCM 数据源密码加密密钥；生产环境务必通过环境变量覆盖
      key: ${DATANEST_ENCRYPTION_KEY:DataNestDefaultEncryptionKey2026}
