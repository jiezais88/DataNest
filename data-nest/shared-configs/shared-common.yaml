# ============================================
# shared-common.yaml
# 公共运行时配置：Redis、Jackson、MVC、LoadBalancer、MyBatis-Plus、日志、Actuator
# 消费方：gateway / system / alert-service / engineering / governance / job / worker
# ============================================

spring:
  # 优雅停机（Boot 4 默认已开启，显式声明便于运维感知）：配合容器 restart 策略，
  # recreate/重启时进行中请求有界收尾（每阶段 15s）
  lifecycle:
    timeout-per-shutdown-phase: 15s
  threads:
    virtual:
      # 虚拟线程（JDK 25 + Boot 4；JEP 491 后 synchronized 不再 pin 载体线程）
      enabled: true
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms

  cloud:
    loadbalancer:
      cache:
        enabled: true
        ttl: 5s
        capacity: 256
      retry:
        avoid-previous-instance: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

logging:
  level:
    root: info
    # 业务包日志级别：默认 info（mapper DEBUG 会刷屏）；排查时通过 DATANEST_LOG_LEVEL=debug 按需开启
    com.datanest: ${DATANEST_LOG_LEVEL:info}
    org.springframework.cloud.loadbalancer: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

# Sprint 7 F1：数据资产目录
datanest:
  asset:
    search:
      # 资产搜索结果裁剪上限（对齐 searchTree 的 MAX_SEARCH_RESULTS 保护）
      max-results: 200
