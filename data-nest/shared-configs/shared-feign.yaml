# Feign 全局容错配置（消费方：使用 Feign 的服务：alert-service/engineering/governance/worker/job）
# 注意：Spring Cloud OpenFeign 5.x（Boot 4）已移除旧 feign.* 命名空间，
#       必须使用 spring.cloud.openfeign.*，否则配置静默失效（circuitbreaker 不装配会导致 fallbackFactory 不生效）。
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: basic
      circuitbreaker:
        enabled: true
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
