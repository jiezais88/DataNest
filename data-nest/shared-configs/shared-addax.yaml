# ============================================
# shared-addax.yaml
# Addax 集成与内置 Doris Stream Load 参数配置
# 消费方: data-nest-engineering
# ============================================
datanest:
  addax:
    home: /opt/addax
    bin: ${datanest.addax.home}/bin/addax.sh
  doris:
    writer:
      fe-load-url: http://doris-fe:8030
      be-load-url: http://doris-be:8040
      username: root
      password: ""
      database: datanest
      load-props:
        format: json
        strip_outer_array: true
      line-delimiter: '\n'
