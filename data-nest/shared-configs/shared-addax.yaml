# ============================================
# shared-addax.yaml
# Addax 集成与内置 Doris Stream Load 参数配置
# 消费方: data-nest-engineering
# ============================================
datanest:
  addax:
    home: /opt/addax
    bin: ${datanest.addax.home}/bin/addax.sh
  doris:
    fe-host: 192.168.119.135
    fe-query-port: 9030
    user: root
    password: password
    writer:
      fe-load-url: http://192.168.119.135:8030
      be-load-url: http://192.168.119.135:8040
      username: root
      password: password
      database: datanest
      load-props:
        format: json
        strip_outer_array: true
      line-delimiter: '\n'
