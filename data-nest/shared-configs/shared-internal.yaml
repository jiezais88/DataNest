# ============================================
# shared-internal.yaml
# 服务间内部调用鉴权配置：Feign 内部端点令牌
# 消费方：system / engineering / governance / worker / job / alert
# ============================================

datanest:
  internal:
    # 内部调用令牌：生产环境务必通过 DATANEST_INTERNAL_TOKEN 环境变量覆盖默认值
    token: ${DATANEST_INTERNAL_TOKEN:datanest-internal-dev-token}
